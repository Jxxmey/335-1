version: '3.8'

services:
  # ------------------------------------
  # ส่วน Backend
  # ------------------------------------
  backend:
    build: ./backend         # 👈 ชี้เข้าไปในโฟลเดอร์ backend ที่วางอยู่ข้างๆ
    container_name: promo_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env       # 👈 อ่านไฟล์ .env ในโฟลเดอร์ backend
    environment:
      - PORT=5000
    restart: unless-stopped

  # ------------------------------------
  # ส่วน Frontend
  # ------------------------------------
  frontend:
    build:
      context: ./frontend    # 👈 ชี้เข้าไปในโฟลเดอร์ frontend ที่วางอยู่ข้างๆ
      dockerfile: Dockerfile
    container_name: promo_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app      # 👈 Map โฟลเดอร์ frontend เข้าไปใน Container
      - /app/node_modules    # 👈 ป้องกัน node_modules ใน Container หาย
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend